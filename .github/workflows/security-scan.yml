name: Security Scan

# Managed centrally - see SECURITY.md. Four scanners, all free on public repos.
# Results appear under Security -> Code scanning.
#
# NO PUSH TRIGGER. These repositories are PRIVATE, where Actions minutes are
# metered: GitHub Free includes 2,000 a month. Four scanners on every push,
# CodeQL among them, consumed the whole September allowance in six days -
# $43.07 of metered usage, fully covered by the included discount so nothing
# was billed, but once the allowance is gone a $0 spending limit stops EVERY
# workflow in the account. That included Deploy to Cloudflare, so the site
# could not ship a security fix that this very scan had found.
#
# Scanning on pull requests and once a week catches the same problems a few
# hours later and costs a fraction of the minutes. A scanner that stops you
# deploying the fix it asked for is not protecting anything.
#
# If these repositories are ever made public, standard runners become free and
# unlimited and the push trigger can come back.

on:
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:

  semgrep:
    name: Semgrep SAST
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        run: semgrep scan --config=auto --sarif --output=semgrep.sarif || true
      - name: Upload results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  trivy:
    name: Trivy dependencies + IaC
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
      - name: Upload results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy

  gitleaks:
    name: Gitleaks secrets
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL (${{ matrix.language }})
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [go]
    steps:
      - uses: actions/checkout@v4
      - name: Initialise CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - name: Analyse
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"